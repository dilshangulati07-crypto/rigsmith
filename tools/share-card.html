<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Share card</title>
  <!-- Layout for img/og-image.jpg (1200 x 630), screenshotted by tools/render-share.mjs. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      font-family: Inter, system-ui, sans-serif; color: #E8EDF7;
      background:
        radial-gradient(60% 80% at 78% 55%, rgb(138 99 255 / .32), transparent 70%),
        radial-gradient(40% 50% at 95% 20%, rgb(255 111 192 / .18), transparent 70%),
        radial-gradient(45% 60% at 60% 90%, rgb(79 134 255 / .25), transparent 70%),
        #0B1222;
      display: grid; grid-template-columns: 500px 1fr; align-items: center; gap: 40px;
      padding: 0 56px 0 72px; box-sizing: border-box;
    }
    .mark { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: -.02em; margin-bottom: 44px; }
    .mark img { width: 42px; height: 42px; }
    h1 { margin: 0 0 22px; font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -.035em; color: #fff; }
    p { margin: 0; font-size: 25px; line-height: 1.4; color: #9AA6BD; }
    .shot {
      width: 560px; height: 448px; border-radius: 28px; overflow: hidden;
      box-shadow: -40px 30px 90px -20px rgb(79 134 255 / .6), 40px -10px 90px -20px rgb(255 111 192 / .45), 0 40px 120px -30px rgb(138 99 255 / .7);
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>
  <div>
    <div class="mark"><img src="../favicon.svg" alt="">Rigsmith</div>
    <h1>Build your next PC in&nbsp;3D.</h1>
    <p>Real parts, live compatibility checks, and a 3D build you can assemble by hand.</p>
  </div>
  <div class="shot"><img src="../img/hero-poster.webp" alt=""></div>
</body>
</html>
